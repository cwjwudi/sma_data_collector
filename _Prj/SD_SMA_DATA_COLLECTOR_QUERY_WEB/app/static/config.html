<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>配置页 - SD SMA Query Web</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>配置页</h1>
      <nav class="nav">
        <a href="/query">查询页</a>
        <a href="/config">配置页</a>
      </nav>
    </header>

    <section class="card">
      <h3>每个 Group 表的列顺序和参数</h3>
      <p class="muted">仅配置你需要的表：列顺序、排序字段、排序方向、分页大小、列中英显示名。</p>
      <div class="row">
        <label>View</label><select id="editViewName"></select>
        <label>Group</label><select id="editGroupName"></select>
        <label>基准表</label><select id="editTableName"></select>
        <button id="btnLoadTableConfig">加载 group 配置</button>
      </div>
      <div id="schemaHint" class="muted"></div>
      <div class="row">
        <label>SortBy</label><select id="tableSortBy"></select>
        <label>SortDir</label>
        <select id="tableSortDir">
          <option value="desc">desc</option>
          <option value="asc">asc</option>
        </select>
        <label>PageSize</label><input id="tablePageSize" type="number" value="50" min="1" max="500" />
      </div>
      <div class="col-editor">
        <div>
          <div class="muted">可选列</div>
          <select id="availableColumns" multiple></select>
        </div>
        <div class="col-actions">
          <button id="btnAddColumns">添加 &gt;&gt;</button>
          <button id="btnRemoveColumns">&lt;&lt; 移除</button>
          <button id="btnMoveUp">上移</button>
          <button id="btnMoveDown">下移</button>
        </div>
        <div>
          <div class="muted">查询列顺序（最终生效）</div>
          <select id="orderedColumns" multiple></select>
        </div>
      </div>
      <div class="row">
        <label>列显示名编辑</label>
      </div>
      <table id="columnLabelTable"></table>
      <div class="row">
        <button id="btnSaveTableConfig">保存当前表配置</button>
      </div>
      <div id="columnEditorHint" class="muted"></div>
    </section>

    <section class="card">
      <h3>插件页面配置（alarm / audit / general）</h3>
      <p class="muted">用于 `/plugins/{module}_{1-5}.html` 动态绑定。支持每个模块 1-5 页预留。</p>
      <div class="row">
        <label>模块</label><select id="pluginModule"></select>
        <label>页码</label>
        <select id="pluginPageIndex">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <button id="btnLoadPluginPage">加载当前页配置</button>
        <button id="btnSavePluginPage">保存当前页配置</button>
      </div>
      <div class="row">
        <label>启用</label><input id="pluginEnabled" type="checkbox" checked />
        <label>标题</label><input id="pluginTitle" type="text" />
      </div>
      <div class="row">
        <label>View</label>
        <select id="pluginViewName">
          <option value="table">table</option>
          <option value="alarm">alarm</option>
          <option value="audit">audit</option>
        </select>
        <label>PageSize</label><input id="pluginPageSize" type="number" value="10" min="1" max="500" />
      </div>
      <div class="row">
        <label>bind_group</label><select id="pluginBindGroup"></select>
      </div>
      <div id="pluginGroupHint" class="muted"></div>
      <div id="pluginConfigHint" class="muted"></div>
    </section>
  </main>
  <script src="/static/config.js"></script>
</body>
</html>
