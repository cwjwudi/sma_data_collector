<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据库管理 - SD SMA DB Admin</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <nav class="page-nav" aria-label="站内导航">
      <span class="page-nav-current">数据库管理</span>
    </nav>

    <div class="layout layout-stack">
      <section class="panel connection-panel">
        <div class="panel-heading">
          <div>
            <h2>连接设置</h2>
            <p class="hint">选择常用配置后只需输入密码；需要改 Host、Port、用户时再点对应快捷项或直接编辑。</p>
          </div>
          <span class="touch-badge">触屏优化</span>
        </div>
        <div class="quick-settings" aria-label="连接快捷设置">
          <div class="quick-group">
            <span class="quick-label">常用连接</span>
            <button type="button" class="quick-chip" data-conn-host="127.0.0.1" data-conn-port="3306" data-conn-user="root">本机 root</button>
            <button type="button" class="quick-chip" data-conn-host="localhost" data-conn-port="3306" data-conn-user="root">localhost</button>
          </div>
          <div class="quick-group">
            <span class="quick-label">用户</span>
            <button type="button" class="quick-chip" data-conn-user="root">root</button>
            <button type="button" class="quick-chip" data-conn-user="admin">admin</button>
            <button type="button" class="quick-chip" data-conn-user="scada">scada</button>
          </div>
          <div class="quick-group">
            <span class="quick-label">端口</span>
            <button type="button" class="quick-chip" data-conn-port="3306">3306</button>
            <button type="button" class="quick-chip" data-conn-port="3307">3307</button>
          </div>
        </div>
        <div class="connection-form">
          <div class="field-block">
            <label for="dbHost">Host</label>
            <input id="dbHost" type="text" inputmode="decimal" autocomplete="off" placeholder="127.0.0.1" />
          </div>
          <div class="field-block field-port">
            <label for="dbPort">Port</label>
            <input id="dbPort" class="field-narrow-num" type="number" inputmode="numeric" min="1" placeholder="3306" />
          </div>
          <div class="field-block">
            <label for="dbUsername">用户</label>
            <input id="dbUsername" type="text" autocomplete="username" placeholder="root" />
          </div>
          <div class="field-block field-password">
            <label for="dbPassword">密码</label>
            <div class="password-control">
              <input id="dbPassword" type="password" autocomplete="current-password" />
              <button type="button" id="btnTogglePassword" class="input-action-btn" aria-label="显示密码">显示</button>
              <button type="button" id="btnClearPassword" class="input-action-btn" aria-label="清空密码">清空</button>
            </div>
          </div>
        </div>
        <div class="connection-actions">
          <button type="button" id="btnTestConnection">测试连接</button>
          <button type="button" id="btnLoadDatabases">读取数据库</button>
        </div>
        <div id="connectionHint" class="muted"></div>
      </section>

      <section class="panel">
        <h2>备份与导出</h2>
        <p class="hint">选择数据库、表和输出目录后执行。整库/单表请用 SQL（适合 GB 级）；CSV 仅适合小数据交换。</p>
        <div class="row">
          <label for="databaseSelect">数据库</label>
          <select id="databaseSelect"></select>
          <button type="button" id="btnRefreshTables">刷新表</button>
          <label for="tableSelect">表</label>
          <select id="tableSelect"></select>
        </div>
        <div class="row">
          <label for="outputDir">导出目录</label>
          <input id="outputDir" type="text" />
          <button type="button" id="btnChooseOutputDir">选择文件夹</button>
          <button type="button" id="btnUseDefaultOutputDir">使用默认目录</button>
        </div>
        <div class="row">
          <button type="button" id="btnBackupSql">备份当前数据库为 SQL</button>
          <button type="button" id="btnBackupTableSql">备份当前表为 SQL</button>
          <button type="button" id="btnExportCsv">导出当前表为 CSV</button>
        </div>
        <div id="objectHint" class="muted"></div>
        <div id="backupHint" class="muted"></div>
      </section>

      <section class="panel">
        <h2>恢复与导入</h2>
        <p class="hint">全部走服务端已完成文件，不经浏览器上传。外部文件请先「登记」到备份目录。大表请用 SQL 恢复，不要用 CSV。</p>
        <div class="row">
          <label for="serverBackupSelect">服务器已完成 SQL 备份</label>
          <select id="serverBackupSelect"></select>
          <button type="button" id="btnRefreshBackups">刷新备份</button>
          <button type="button" id="btnRegisterSql">登记本地 SQL</button>
          <button type="button" id="btnRestoreServerBackup" class="danger-btn">直接恢复 SQL</button>
        </div>
        <div class="row">
          <label for="restoreDatabaseSelect">恢复到数据库</label>
          <select id="restoreDatabaseSelect"></select>
        </div>
        <div class="row">
          <label for="serverCsvSelect">服务器已导出 CSV</label>
          <select id="serverCsvSelect"></select>
          <button type="button" id="btnRefreshCsvExports">刷新 CSV</button>
          <button type="button" id="btnRegisterCsv">登记本地 CSV</button>
        </div>
        <div class="row">
          <label for="importDatabaseSelect">导入到数据库</label>
          <select id="importDatabaseSelect"></select>
          <button type="button" id="btnRefreshImportTables">刷新目标表</button>
          <label for="importTableSelect">导入到表</label>
          <select id="importTableSelect"></select>
        </div>
        <div class="row">
          <label for="truncateBeforeImport">清空表</label>
          <input id="truncateBeforeImport" type="checkbox" />
          <button type="button" id="btnImportServerCsv" class="danger-btn">直接导入 CSV</button>
        </div>
        <div id="importHint" class="muted warn"></div>
      </section>

      <section class="panel">
        <h2>任务日志</h2>
        <div class="row">
          <button type="button" id="btnRefreshJobs">刷新任务</button>
          <span id="jobSummary" class="muted"></span>
        </div>
        <div class="jobs-grid">
          <table id="jobsTable"></table>
          <textarea id="jobLog" readonly aria-label="任务日志"></textarea>
        </div>
      </section>
    </div>

    <div id="confirm-modal-overlay" class="modal-overlay" style="display: none">
      <div class="modal-dialog">
        <h3 id="confirm-modal-title" class="modal-title">确认</h3>
        <p id="confirm-modal-message" class="hint"></p>
        <div class="modal-footer">
          <button id="confirm-modal-cancel" type="button">取消</button>
          <button id="confirm-modal-confirm" type="button" class="danger-btn">确认执行</button>
        </div>
      </div>
    </div>

    <script src="/static/admin.js"></script>
  </body>
</html>
