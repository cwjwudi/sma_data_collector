# MariaDB：127.0.0.1:3306 / root / 密码与环境变量 MARIADB_ROOT_PASSWORD 一致时见 compose 解析结果
# OPC UA 演示：opc.tcp://127.0.0.1:${OPCUA_DEMO_PORT:-4840}/report-editor/demo-opcua/（匿名）
# Docker Hub 超时时可先：export PYTHON_BASE_IMAGE=docker.m.daocloud.io/library/python:3.11-slim-bookworm

services:
  mariadb:
    image: mariadb:11
    container_name: report_editor_mariadb
    restart: unless-stopped
    environment:
      # 必须通过环境变量或 .env 提供，不再内置默认口令
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?请在环境变量或 .env 中设置 MARIADB_ROOT_PASSWORD}"
      MARIADB_DATABASE: ${MARIADB_DATABASE:-report}
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATE_SERVER: utf8mb4_unicode_ci
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  opcua-demo:
    build:
      context: ./backend
      dockerfile: Dockerfile.opcua-demo
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.io/library/python:3.11-slim-bookworm}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: sd-sma-report-editor-opcua-demo:local
    container_name: report_editor_opcua_demo
    restart: unless-stopped
    ports:
      - "${OPCUA_DEMO_PORT:-4840}:4840"
    command: ["--host", "0.0.0.0", "--port", "4840", "--path", "report-editor/demo-opcua"]

volumes:
  mariadb_data:
