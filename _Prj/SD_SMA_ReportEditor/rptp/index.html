<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPTP · 报表工作台占位页</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #f4f4f5;
      color: #18181b;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #18181b; color: #fafafa; }
    }
    main {
      max-width: 36rem;
      text-align: center;
    }
    h1 { font-size: 1.375rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { margin: 0; opacity: 0.85; font-size: 0.9375rem; }
    code {
      font-size: 0.8125rem;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      code { background: rgba(255, 255, 255, 0.08); }
    }
  </style>
</head>
<body>
  <main>
    <h1>RPTP</h1>
    <p>此处为报表相关单页应用的占位入口，后续可替换为构建产物或接入 PLC Web 服务。</p>
