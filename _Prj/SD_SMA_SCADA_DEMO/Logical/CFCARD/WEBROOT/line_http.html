<!DOCTYPE html>
<html lang="zh-CN" style="height: 100%">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC 实时数据监控</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
</head>
<body style="height: 100%; margin: 0; background-color: #f4f7f9;">
    <div id="container" style="height: 100%; width: 100%;"></div>

  <script type="text/javascript">
        const dom = document.getElementById("container");
        const myChart = echarts.init(dom);

        function formatTime(timestamp) {
            const date = new Date(timestamp * 1000);
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const seconds = date.getSeconds().toString().padStart(2, '0');
            return hours + ':' + minutes + ':' + seconds;
        }

        const baseOption = {
            title: {
                text: "PLC 实时数据监控",
                subtext: "状态：等待连接...",
                left: "center",
                top: 20,
                textStyle: { color: '#333' },
                subtextStyle: { color: '#666' }
            },
            tooltip: {
                trigger: "axis",
                backgroundColor: 'rgba(255, 255, 255, 0.9)',
                borderWidth: 1,
                formatter: function(params) {
                    let p = params[0];
                    return '时间: ' + p.name + '<br/>数值: <b>' + p.value + '</b>';
                }
            },
            grid: {
                left: '5%', right: '5%', bottom: '10%', containLabel: true
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                axisLine: { lineStyle: { color: '#999' } },
                axisLabel: { rotate: 45, fontSize: 11 },
                data: []
            },
            yAxis: {
                type: 'value',
                splitLine: { lineStyle: { type: 'dashed' } }
            },
            series: [{
                name: "实时变量",
                type: 'line',
                smooth: true,
                symbol: 'circle',
                symbolSize: 6,
                sampling: 'lttb',
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: 'rgba(58, 77, 233, 0.5)' },
                        { offset: 1, color: 'rgba(58, 77, 233, 0)' }
                    ])
                },
                itemStyle: { color: '#3a4de9' },
                data: []
            }]
        };

        myChart.setOption(baseOption);
        myChart.showLoading({ text: '正在连接服务器...' });

        function fetchData() {
            $.ajax({
                url: "http://127.0.0.1:8000/data",
                type: "GET",
                dataType: "json",
                timeout: 5000,
                success: function (res) {
                    myChart.hideLoading();
                    
                    if (res && res.length > 0) {
                        const times = res.map(item => formatTime(item[0]));
                        const values = res.map(item => item[1]);

                        myChart.setOption({
                            title: { 
                                subtext: '状态：已连接 | 数据点: ' + res.length + ' | 更新时间: ' + formatTime(Math.floor(Date.now() / 1000)),
                                subtextStyle: { color: 'green' }
                            },
                            xAxis: { data: times },
                            series: [{ data: values }]
                        });
                    } else {
                        myChart.setOption({
                            title: { 
                                subtext: "状态：已连接 | 等待 Postman 推送数据...",
                                subtextStyle: { color: 'orange' }
                            }
                        });
                    }
                },
                error: function (xhr, status, error) {
                    console.error("数据获取失败:", error);
                    myChart.hideLoading();
                    myChart.setOption({
                        title: { 
                            subtext: "状态：连接失败", 
                            subtextStyle: { color: 'red' } 
                        }
                    });
                }
            });
        }

        fetchData();
        const timer = setInterval(fetchData, 2000);

        window.addEventListener("resize", function() {
            myChart.resize();
        });

        window.addEventListener("beforeunload", function() {
            clearInterval(timer);
        });
    </script>
</body>
</html>
